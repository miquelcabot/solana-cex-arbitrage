[package]
name = "solana-cex-arbitrage"
version = "0.1.0"
edition = "2024"
description = "Real-time arbitrage scanner monitoring Solana and CEX markets via WebSocket connections"
authors = ["Miquel A. Cabot <miquel@cabot.dev>"]

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.50", features = ["derive"] }
env_logger = "0.11.8"
futures-util = "0.3"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.20"
url = "2.4"
